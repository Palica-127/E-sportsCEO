name: Gerar .exe (Windows)

# Roda quando você clica em "Run workflow" na aba Actions do GitHub,
# quando cria uma tag começando com v (ex.: v1.0.0), que também publica um Release,
# ou quando a pasta desktop/ muda na branch reforma.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: [reforma]
    paths: ['desktop/**', '.github/workflows/exe.yml']

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build do jogo
        run: |
          npm install
          npm run build
      - name: Empacotar com Electron
        working-directory: desktop
        run: |
          npm install
          npm run exe
      - name: Guardar o .exe
        uses: actions/upload-artifact@v4
        with:
          name: eSportsCEO-windows
          path: desktop/release/*.exe
      - name: Publicar Release (só em tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/release/*.exe
