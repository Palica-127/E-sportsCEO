<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mini Idle 3 em 1</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--c:#22d3ee}
body{margin:0;background:#0e1014;color:#e8eaf0;font:15px/1.35 system-ui,-apple-system,Segoe UI,sans-serif;padding-bottom:40px}
.wrap{max-width:520px;margin:0 auto;padding:0 12px}
.tabs{position:sticky;top:0;z-index:5;display:flex;gap:6px;background:#0e1014;padding:10px 12px 8px;max-width:520px;margin:0 auto}
.tab{flex:1;padding:10px 4px;border:1px solid #2a2f3a;background:#171a21;color:#9aa3b5;border-radius:12px;font-size:13px;font-weight:600}
.tab.on{background:var(--c);color:#06090d;border-color:var(--c)}
.hero{text-align:center;padding:14px 0 6px}
.stage{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--c)}
.bal{font-size:40px;font-weight:800;margin:2px 0}
.ps{color:#9aa3b5;font-size:13px}
#sc{width:100%;display:block;border-radius:16px;margin:4px 0 6px;background:#000}
.msg{min-height:34px;margin:8px 0;font-size:13px;color:#b7bfd0;text-align:center;font-style:italic}
.clickbox{position:relative;margin:6px 0 14px}
.big{width:100%;padding:20px;border:0;border-radius:18px;background:var(--c);color:#06090d;font-size:18px;font-weight:800;box-shadow:0 5px 0 rgba(0,0,0,.45)}
.big:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.45)}
.pop{position:absolute;pointer-events:none;font-weight:800;color:#fff;text-shadow:0 1px 3px #000;animation:up .8s forwards}
@keyframes up{to{transform:translateY(-60px);opacity:0}}
.modes{display:flex;gap:6px;margin-bottom:10px;align-items:center}
.modes span{font-size:12px;color:#9aa3b5;margin-right:4px}
.mode{padding:7px 14px;border:1px solid #2a2f3a;background:#171a21;color:#cfd5e3;border-radius:999px;font-size:13px}
.mode.on{border-color:var(--c);color:var(--c)}
.row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:#171a21;border:1px solid #232834;border-radius:14px;padding:10px 12px;margin-bottom:8px}
.nm{font-weight:700}
.ds{font-size:12px;color:#8e97ab}
.own{font-size:12px;color:var(--c);margin-top:2px}
.buy{min-width:112px;min-height:46px;padding:6px 10px;border:0;border-radius:10px;background:var(--c);color:#06090d;font-weight:700;font-size:13px}
.buy:disabled{background:#2a2f3a;color:#6b7488}
.reset{display:block;margin:18px auto 0;background:none;border:1px solid #2a2f3a;color:#7d869a;padding:8px 14px;border-radius:10px;font-size:12px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#232834;border:1px solid var(--c);padding:10px 14px;border-radius:12px;font-size:13px;opacity:0;transition:.3s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="tabs" id="tabs"></div>
<div class="wrap">
  <div class="hero">
    <div class="stage" id="stage"></div>
    <div class="bal" id="bal">0</div>
    <div class="ps" id="ps"></div>
  </div>
  <canvas id="sc"></canvas>
  <div class="msg" id="msg"></div>
  <div class="clickbox" id="cb"><button class="big" id="big"></button></div>
  <div class="modes"><span>Comprar:</span>
    <button class="mode" data-m="1">x1</button>
    <button class="mode" data-m="10">x10</button>
    <button class="mode" data-m="max">Máx</button>
  </div>
  <div id="rows"></div>
  <button class="reset" id="reset">Zerar este jogo</button>
</div>
<div class="toast" id="toast"></div>
<script>
const GAMES={
lan:{name:"Lan House",emoji:"🖥️",color:"#22d3ee",cur:"R$",click:"Atender cliente",base:1,
 gens:[
  ["PC Pentium","Roda CS 1.6 a 30 fps",15,0.1],
  ["Ar-condicionado","Cliente fica mais tempo",100,1],
  ["Salgadinho no balcão","Coxinha e Guaraná",1100,8],
  ["Campeonato de CS","Inscrição de R$10 por time",12000,47],

  ["Sala VIP gamer","Cadeira gamer e RGB",1.4e6,1400],
  ["Franquia","Uma lan em cada bairro",20e6,7800],
  ["Rede de arenas","Vira empresa de eSports",330e6,44000]],
 stages:[[0,"Garagem do tio"],[1e3,"Lan de bairro"],[5e4,"Lan lotada"],[2e6,"Referência na cidade"],[1e8,"Império das lans"]],

civ:{name:"Caverna ao Espaço",emoji:"🚀",color:"#f59e0b",cur:"🔬",click:"Explorar",base:1,
 gens:[
  ["Coletor","Junta fruta e graveto",15,0.1],
  ["Fogueira","Comida cozida, tribo feliz",100,1],
  ["Agricultura","Nasce a primeira vila",1100,8],
  ["Roda","O comércio começa a rodar",12000,47],
  ["Escrita","A história começa aqui",130000,260],
  ["Navegação","Grandes navegações",1.4e6,1400],
  ["Máquina a vapor","Revolução Industrial",20e6,7800],
  ["Computador","Chegou a era digital",330e6,44000],
  ["Foguete","Conquista do espaço",5.1e9,260000]],
 stages:[[0,"Idade da Pedra"],[1e3,"Antiguidade"],[5e4,"Idade Média"],[2e6,"Era Industrial"],[1e8,"Era Espacial"]],
 msgs:["Fato: a roda surgiu na Mesopotâmia, por volta de 3500 a.C.","Fato: a escrita nasceu na Suméria.","Fato: o fogo foi dominado há mais de 400 mil anos.","Fato: o Brasil foi chegado por Cabral em 1500.","Fato: Yuri Gagarin foi ao espaço em 1961.","Os mamutes fugiram de novo."]},
esp:{name:"Time de eSports",emoji:"🏆",color:"#a855f7",cur:"⭐",click:"Treinar",base:1,
 gens:[
  ["Jogador de várzea","Joga por uma pizza",15,0.1],
  ["Coach","Ensina o time a ler o mapa",100,1],
  ["Gaming house","Moram, treinam e brigam",1100,8],
  ["Patrocínio local","Camisa com logo da padaria",12000,47],
  ["Streamer do time","Live de 12 horas",130000,260],
  ["Fã-clube","Torcida organizada",1.4e6,1400],
  ["Arena própria","Casa cheia em todo jogo",20e6,7800],
  ["Título mundial","Levanta a taça!",330e6,44000]],
 stages:[[0,"Time de várzea"],[1e3,"Circuito regional"],[5e4,"Liga nacional"],[2e6,"Classificado pro Mundial"],[1e8,"Lenda dos eSports"]],
 msgs:["O top laner jogou 14 horas seguidas.","Seu ADC culpou o lag. De novo.","Chegou proposta de patrocínio de energético.","O coach pediu mais um café.","Fãs lotaram os comentários da live.","Derrota por 1 torre. Dói."]}
};
const SCENES={};
// Cena "Lan House Tycoon": a lan house cresce visualmente conforme os upgrades comprados.
(function () {
  var X, PA = [], lastSp = -9;
  for (var q = 0; q < 24; q++) PA.push({ a: 0, x: 0, y: 0, vx: 0, vy: 0, t0: null, k: 0 });
  var SKIN = ['#f2c9a0', '#d9a06b', '#b87a4b', '#8a5a3a'];
  var SHIRT = ['#e63946', '#3a86ff', '#2a9d8f', '#f4a261', '#9b5de5', '#fee440'];
  var SCR = ['#46e6ff', '#7dff9a', '#ffb347', '#ff6bd6'];
  var CHIP = ['#e63946', '#f4a261', '#ffd23f', '#2a9d8f', '#3a86ff'];
  var NEON = ['#ff4fd8', '#4ff0ff', '#ffe14f', '#7dff6a', '#ff7a4f'];

  function G(o, i) { var v = o && +o[i]; return v > 0 ? Math.floor(v) : 0; }
  function hs(n) { var s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }
  function rect(c, x, y, w, h) { X.fillStyle = c; X.fillRect(x, y, w, h); }
  function dot(c, x, y, r) { X.fillStyle = c; X.beginPath(); X.arc(x, y, r, 0, 6.2832); X.fill(); }
  function txt(s, x, y, c, px, al) { X.font = 'bold ' + px + 'px monospace'; X.textAlign = al || 'center'; X.fillStyle = c; X.fillText(s, x, y); }
  function A(a) { X.globalAlpha = a; }
  function HC(h, l) { return 'hsl(' + ((((h % 360) + 360) % 360) | 0) + ',95%,' + (l || 60) + '%)'; }
  function mix(a, b, k) { return (a + (b - a) * k) | 0; }

  // Pessoa vista de frente atras do monitor/balcao
  function person(x, y, i, bob, hair) {
    rect(SHIRT[i % 6], x - 6, y + 3 + bob * 0.5, 12, 5);
    dot(SKIN[(i * 7) % 4], x, y + bob, 3.2);
    rect(hair || '#2b2118', x - 3.2, y - 3.4 + bob, 6.4, 2.2);
  }

  SCENES.lan = {
    h: 230,
    draw: function (ctx, W, H, o, t) {
      X = ctx;
      X.textBaseline = 'alphabetic';
      var p = G(o, 0), ac = G(o, 1), sn = G(o, 2), cs = G(o, 3), fb = G(o, 4), vip = G(o, 5), fr = G(o, 6), ar = G(o, 7);
      var lvl = Math.min(1, (p + ac * 2 + sn + cs * 3 + fb * 2 + vip * 3 + fr * 5 + ar * 8) / 40);
      var poor = (p + ac + sn + cs + fb + vip + fr + ar) < 2;
      var i, k, x, y, g, c;

      // ---------- Ceu, skyline, arenas, lojas ----------
      g = X.createLinearGradient(0, 0, 0, 80);
      g.addColorStop(0, '#0a0e2a'); g.addColorStop(1, ar > 0 ? '#5a2f78' : '#2a3260');
      X.fillStyle = g; X.fillRect(0, 0, W, 84);
      for (i = 0; i < 16; i++) { A(0.3 + 0.5 * Math.abs(Math.sin(t * 1.7 + i * 2.3))); rect('#fff', hs(i) * W, hs(i + 40) * 38, 1.2, 1.2); }
      A(1);
      dot('#f4efcf', W * 0.9, 15, 6); dot('#101640', W * 0.9 + 3, 13, 5.5);
      for (x = -4, k = 0; x < W; x += 16, k++) {
        var bh = 12 + hs(k) * 28;
        rect('#141a38', x, 80 - bh, 15, bh);
        for (i = 0; i < 2; i++) {
          if (hs(k * 3 + i) > 0.5) { A(0.5 + 0.4 * Math.sin(t * 0.8 + k + i)); rect('#ffd66b', x + 3 + i * 6, 80 - bh + 4 + (hs(k + i) * 8 | 0), 3, 3); }
        }
      }
      A(1);
      if (ar > 0) {
        var na = Math.min(ar, 4);
        for (i = 0; i < na; i++) {
          var cx = na === 1 ? W * 0.5 : W * (0.14 + 0.24 * i);
          rect('#2b2f5e', cx - 28, 56, 56, 24);
          X.fillStyle = '#3d4390'; X.beginPath(); X.arc(cx, 56, 28, Math.PI, 0); X.fill();
          rect(HC(t * 60 + i * 70, 55), cx - 28, 60, 56, 2);
          txt('ARENA', cx, 74, '#e8ecff', 7);
          rect('#888', cx, 22, 1, 8); rect('#e63946', cx + 1, 22, 6 + Math.sin(t * 4 + i) * 1.5, 4);
          var ang = Math.sin(t * 1.1 + i * 1.7) * 0.6, bx = cx + Math.sin(ang) * 70;
          A(0.14); X.fillStyle = '#fff6c8'; X.beginPath();
          X.moveTo(cx - 3, 29); X.lineTo(bx - 9, -4); X.lineTo(bx + 9, -4); X.lineTo(cx + 3, 29); X.fill(); A(1);
        }
        if (ar > 4) txt('+' + (ar - 4) + ' arenas', 5, 11, '#ffd23f', 8, 'left');
      }
      if (fr > 0) {
        var ns = Math.min(fr, 5);
        for (i = 0; i < ns; i++) {
          x = 4 + i * 42; c = NEON[i % 5];
          rect('#262a4c', x, 50, 38, 28); rect('#1a1d38', x, 50, 38, 3);
          for (k = 0; k < 4; k++) rect(k % 2 ? '#f0f0f0' : '#e63946', x + k * 9.5, 53, 9.5, 5);
          A(0.55 + 0.45 * Math.sin(t * 3 + i * 2)); rect(c, x + 3, 61, 32, 8); A(1);
          txt('LAN ' + (i + 2), x + 19, 68, '#10101c', 7);
          rect('#101424', x + 4, 70, 9, 8); rect('#3a4a7a', x + 17, 71, 16, 6);
        }
        if (fr > 5) txt('+' + (fr - 5) + ' lojas', W - 5, 11, '#ffd23f', 8, 'right');
      }

      // ---------- Sala: teto, parede, piso ----------
      rect('#0d0f1f', 0, 78, W, 7); rect('#2a2d52', 0, 78, W, 1);
      g = X.createLinearGradient(0, 85, 0, 170);
      g.addColorStop(0, 'rgb(' + mix(62, 38, lvl) + ',' + mix(54, 40, lvl) + ',' + mix(60, 110, lvl) + ')');
      g.addColorStop(1, 'rgb(' + mix(50, 28, lvl) + ',' + mix(44, 30, lvl) + ',' + mix(52, 84, lvl) + ')');
      X.fillStyle = g; X.fillRect(0, 85, W, 85);
      rect('#17121f', 0, 166, W, 4);
      rect('rgb(' + mix(74, 30, lvl) + ',' + mix(62, 36, lvl) + ',' + mix(54, 64, lvl) + ')', 0, 170, W, 60);
      A(0.25);
      for (y = 180; y < 230; y += 14) rect('#000', 0, y, W, 1);
      A(1);

      // zonas
      var lm = sn > 0 ? 62 : 6;
      var rm = (cs > 0 || vip > 0) ? Math.max(78, Math.floor(W * 0.27)) : 6;
      var aw = W - lm - rm, x0 = lm, mid = x0 + aw / 2;

      // luzes do teto
      if (ac === 0) {
        rect('#222', mid, 85, 1, 9);
        A(hs(Math.floor(t * 9)) > 0.93 ? 0.08 : 0.18); dot('#ffe9a6', mid, 96, 15); A(1);
        dot('#ffe9a6', mid, 96, 3.5);
      } else {
        var nt = 1 + Math.min((lvl * 6) | 0, 4);
        for (i = 0; i < nt; i++) {
          x = W * (i + 1) / (nt + 1) - 13;
          A(0.12); rect('#cfe8ff', x - 3, 86, 32, 5); A(1); rect('#eaf6ff', x, 85, 26, 3);
        }
      }

      // ---------- Parede: ar-condicionado ----------
      if (ac > 0) {
        var nac = Math.min(ac, 5), step = nac > 1 ? Math.min(44, (W - rm - 62) / (nac - 1)) : 0;
        for (i = 0; i < nac; i++) {
          x = 8 + i * step;
          rect('#e9edf2', x, 86, 40, 10); rect('#b9c0cc', x, 94, 40, 2); rect('#8f99a8', x + 3, 91, 34, 2);
          dot(Math.sin(t * 3 + i) > 0 ? '#5cff8a' : '#2a8a48', x + 35, 88, 1.2);
          for (k = 0; k < 3; k++) {
            var ph = (t * 0.8 + k * 0.33 + i * 0.2) % 1;
            A(0.55 * (1 - ph)); rect('#bfefff', x + 7 + k * 12 + Math.sin(t * 3 + k + ph * 5) * 3, 97 + ph * 26, 1.6, 5);
          }
          A(1);
        }
      } else {
        var fx = x0 + aw - 16, fa = t * 9;
        rect('#555', fx - 1, 108, 2, 6); dot('#777', fx, 102, 8);
        X.strokeStyle = '#ccd'; X.lineWidth = 3;
        for (k = 0; k < 3; k++) { X.beginPath(); X.moveTo(fx, 102); X.lineTo(fx + Math.cos(fa + k * 2.094) * 7, 102 + Math.sin(fa + k * 2.094) * 7); X.stroke(); }
        dot('#333', fx, 102, 1.5);
      }

      // letreiro
      if (poor) {
        rect('#4b3a24', mid - 45, 95, 90, 19); rect('#7a6446', mid - 43, 97, 86, 15);
        txt('LAN HOUSE', mid, 108, '#f1e4c0', 11);
        txt('R$ 2 / hora', mid, 124, '#cbbf9f', 7);
      } else {
        c = NEON[(t / 2 | 0) % 5];
        var on = hs(Math.floor(t * 7)) > 0.07 ? 1 : 0.45;
        rect('#120d1c', mid - 49, 93, 98, 27);
        A(0.7 * on); rect(c, mid - 49, 93, 98, 1.5); rect(c, mid - 49, 118.5, 98, 1.5); rect(c, mid - 49, 93, 1.5, 27); rect(c, mid + 47.5, 93, 1.5, 27);
        A(0.3 * on); txt('LAN HOUSE', mid + 1, 108, c, 15); A(on); txt('LAN HOUSE', mid, 107, c, 14); A(1);
        txt(fr > 0 ? 'FRANQUIA OFICIAL' : 'R$ 2 / hora', mid, 116, '#d7dbea', 7);
      }
      // posters e bandeira
      if (p >= 2) { rect('#d62828', x0 + 6, 94, 14, 20); txt('CS', x0 + 13, 106, '#fff', 7); }
      if (p >= 5) { rect('#5b3fd0', x0 + 22, 98, 12, 16); txt('LoL', x0 + 28, 108, '#ffd23f', 6); }
      if (ac > 0 && p >= 10) { rect('#1c8b8b', x0 + aw - 22, 94, 14, 20); txt('1.6', x0 + aw - 15, 106, '#fff', 6); }
      if (lvl > 0.05) {

        X.fillStyle = '#ffd23f'; X.beginPath(); X.moveTo(bx0 + 9, by0 + 1); X.lineTo(bx0 + 16, by0 + 5.5); X.lineTo(bx0 + 9, by0 + 10); X.lineTo(bx0 + 2, by0 + 5.5); X.fill();

      // ---------- Fibra optica ----------
      var shown = Math.min(Math.max(p, 1), 24);

      if (fb > 0) {

        for (k = -1; k < rows; k++) {

        var nc = Math.min(sn, 6);
        for (i = 0; i < nc; i++) {
          var tx = 12 + (i % 3) * 9, ty = 150 + (i / 3 | 0) * 8;
          X.fillStyle = '#d98b2b'; X.beginPath(); X.moveTo(tx, ty + 6); X.lineTo(tx + 3, ty - 2); X.lineTo(tx + 6, ty + 6); X.fill();
        }
        person(50, 153, 3, Math.sin(t * 2) * 0.8, '#5a2d12');
        rect('#9a6a3c', 2, 164, cw + 4, 5);
        txt('LANCHE', 4 + cw / 2, 186, '#ffd23f', 8);
        txt('coxinha R$3', 4 + cw / 2, 200, '#e8e0d0', 6);

      }

      // ---------- PCs ----------
      for (i = 0; i < shown; i++) {
        var r = (i / cols) | 0, cc = i - r * cols, cnt = Math.min(cols, shown - r * cols);

        if (i % 2) { rect('#222', pxc - 4, dy - 18 + bob, 1.5, 4); rect('#222', pxc + 2.5, dy - 18 + bob, 1.5, 4); }
        rect('#1b1b22', pxc - 7, dy - 11, 14, 10);
        var ci = ((t * (2 + i % 3) + i) | 0) % 4;
        rect(p === 0 ? '#6a8a7a' : SCR[ci], pxc - 6, dy - 10, 12, 7);
        A(0.8); rect('#fff', pxc - 6 + (t * 18 + i * 5) % 10, dy - 10 + (i * 3) % 5, 2, 1); A(1);
        rect('#cfd2d6', pxc - 5, dy - 1, 10, 2);
        rect('#6b4a2f', pxc - 10, dy + 1, 20, 3); rect('#4d341f', pxc - 10, dy + 4, 20, 6);
      }
      if (p > 24) txt('+' + (p - 24) + ' PCs', x0 + aw - 2, 228, '#ffd23f', 8, 'right');

      // ---------- Palco / campeonato ----------
      var sx = W - rm + 3, sw = rm - 8;
      if (cs > 0) {
        rect('#0a0a12', sx, 90, sw, 36); rect('#06223a', sx + 2, 92, sw - 4, 32);

      if (e > 0) { for (i = 0; i < 12; i++) { ctx.fillStyle = BEAM[(i + Math.floor(t * 3)) % 4]; ctx.fillRect(i * W / 12, gy, W / 12 - 1, 2); } }
      else { ctx.fillStyle = '#000'; ctx.globalAlpha = 0.25; ctx.fillRect(0, gy, W, 2); ctx.globalAlpha = 1; }

      // ---- troféu ----
      if (w > 0) {
        var gold = '#ffd54a', dk = '#e0a000';
        ctx.fillStyle = '#2a2140'; ctx.fillRect(cx - 16, 122, 32, 8);
        ctx.strokeStyle = dk; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(cx - 12, 93, 5, 0, TAU); ctx.stroke(); ctx.beginPath(); ctx.arc(cx + 12, 93, 5, 0, TAU); ctx.stroke();
        ctx.fillStyle = gold; ctx.beginPath(); ctx.moveTo(cx - 12, 84); ctx.lineTo(cx + 12, 84);
        ctx.quadraticCurveTo(cx + 12, 106, cx, 108); ctx.quadraticCurveTo(cx - 12, 106, cx - 12, 84); ctx.fill();
        ctx.fillStyle = '#fff6b0'; ctx.globalAlpha = 0.6; ctx.fillRect(cx - 8, 86, 2, 12); ctx.globalAlpha = 1;
        ctx.fillStyle = dk; ctx.fillRect(cx - 2, 108, 4, 10); ctx.fillRect(cx - 9, 118, 18, 4);
        for (i = 0; i < 5; i++) { var an = t * 1.2 + i * TAU / 5; star(ctx, cx + Math.cos(an) * 26, 98 + Math.sin(an) * 20, 2 + 2 * Math.abs(Math.sin(t * 4 + i)), '#fff6b0'); }
        txt(ctx, w > 1 ? 'CAMPEÃO MUNDIAL ×' + fmt(w) : 'CAMPEÃO MUNDIAL', cx, 139, 'bold 7px sans-serif', gold, 'center');
      }

      // ---- jogadores ----
      var vis = Math.max(1, Math.min(10, Math.floor(a))), px0 = 8, px1 = W - (c > 0 ? 80 : 8);
      if (a > 10) px1 -= 22;
      var s = Math.min(30, (px1 - px0) / vis), st0 = px0 + ((px1 - px0) - s * vis) / 2, kk = Math.min(1, s / 30);
      for (i = 0; i < vis; i++) player(ctx, i, st0 + s * (i + 0.5), kk, t, gy, st > 0 && i === 0);
      if (a > 10) txt(ctx, '+' + fmt(a - 10), px1 + 2, gy - 4, 'bold 10px sans-serif', '#ffd54a', 'left');

      // ---- coach ----
      if (c > 0) {
        var kx = W - 26, bob = Math.sin(t * 2);
        ctx.save(); ctx.translate(kx, gy); ctx.scale(1.1, 1.1);
        ctx.fillStyle = '#2b2f45'; ctx.fillRect(-5, -14, 4, 14); ctx.fillRect(1, -14, 4, 14);
        ctx.fillStyle = '#1f6feb'; ctx.fillRect(-7, -32, 14, 18); ctx.fillStyle = '#fff'; ctx.fillRect(-1, -32, 2, 18);
        circ(ctx, 0, -37, 5, SKIN[1]); ctx.fillStyle = '#c0392b'; ctx.fillRect(-5, -44, 10, 3);
        ctx.fillStyle = '#fff'; ctx.fillRect(-17, -30 + bob, 9, 12); ctx.fillStyle = '#888'; ctx.fillRect(-15, -27 + bob, 5, 1); ctx.fillRect(-15, -24 + bob, 5, 1);
        ctx.strokeStyle = '#1f6feb'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(7, -30); ctx.lineTo(11 + bob * 2, -42); ctx.stroke();
        ctx.restore();
        if (c > 1) txt(ctx, '×' + fmt(c), kx, gy + 9, 'bold 7px sans-serif', '#9cf', 'center');
      }

      // ---- torcida ----
      var m2 = Math.min(12, Math.floor(f));
      for (i = 0; i < m2; i++) {
        x = W * (i + 1) / (m2 + 1); y = H - 3 - Math.abs(Math.sin(t * 5 + i * 1.3)) * 9;
        ctx.fillStyle = SHIRT[(i + 3) % 10]; ctx.fillRect(x - 4, y - 12, 8, 12);
        circ(ctx, x, y - 16, 4, SKIN[i % 5]);
        ctx.strokeStyle = SKIN[i % 5]; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x - 4, y - 10); ctx.lineTo(x - 7, y - 21); ctx.stroke();
        if (!(i & 1)) { ctx.strokeStyle = '#ccc'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x + 4, y - 10); ctx.lineTo(x + 7, y - 26); ctx.stroke(); ctx.fillStyle = SHIRT[i % 10]; ctx.fillRect(x + 7, y - 26, 8, 5); }
      }
      if (f > 12) txt(ctx, '+' + fmt(f - 12) + ' fãs', W - 6, H - 4, 'bold 8px sans-serif', '#fff', 'right');
      if (f > 0) { // bandeirinhas
        var nf = Math.min(30, 6 + Math.floor(f) * 2);
        ctx.strokeStyle = '#ddd'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(0, 2); ctx.quadraticCurveTo(cx, 18, W, 2); ctx.stroke();
        for (i = 0; i < nf; i++) {
          var u = (i + 0.5) / nf; x = u * W; y = 2 + 8 * (1 - (2 * u - 1) * (2 * u - 1)) + Math.sin(t * 3 + i) * 0.8;
          ctx.fillStyle = CONF[i % 5]; ctx.beginPath(); ctx.moveTo(x - 4, y); ctx.lineTo(x + 4, y); ctx.lineTo(x, y + 8); ctx.fill();
        }
      }

      // ---- legenda ----
      ctx.globalAlpha = 0.8; txt(ctx, CAP[tier], 8, gy + 9, 'bold 8px sans-serif', '#fff', 'left'); ctx.globalAlpha = 1;

      // ---- confetes ----
      if (w > 0) {
        for (i = 0; i < 46; i++) {
          x = R[(i * 3) & 255] * W + Math.sin(t * 1.7 + i) * 10;
          y = ((t * (28 + R[(i * 5) & 255] * 30) + R[(i * 7) & 255] * (H + 30)) % (H + 30)) - 15;
          ctx.fillStyle = CONF[i % 6]; ctx.fillRect(x, y, 1.5 + Math.abs(Math.cos(t * 4 + i)) * 4, 3);
        }
      }
      spark(ctx, t);
      ctx.textAlign = 'left'; ctx.globalAlpha = 1;
    },
    burst: function (ctx, W, H, t) {
      bt = t; bx = W * (0.25 + 0.5 * R[bn & 255]); by = H * 0.45; bn++;
      spark(ctx, t);
    }
  };
})();


const K="idle3-v1",MAXAWAY=28800;
let st;try{st=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!st||!st.g)st={cur:"lan",g:{},last:Date.now(),mode:"1"};
for(const k in GAMES){const s=st.g[k]||(st.g[k]={});s.m=s.m||0;s.t=s.t||0;s.o=s.o||[];while(s.o.length<GAMES[k].gens.length)s.o.push(0)}
if(!GAMES[st.cur])st.cur="lan";
const $=id=>document.getElementById(id);
const mult=o=>Math.pow(2,Math.floor(o/25));
const ps=k=>GAMES[k].gens.reduce((a,g,i)=>a+st.g[k].o[i]*g[3]*mult(st.g[k].o[i]),0);
const clickVal=k=>GAMES[k].base+ps(k)*0.03;
function fmt(n){
  if(n<10)return(Math.floor(n*10)/10).toString().replace(".",",");
  if(n<1000)return Math.floor(n).toString();
  const S=["mil","mi","bi","tri","qua","qui"];let i=-1;
  while(n>=1000&&i<S.length-1){n/=1000;i++}
  return(Math.floor(n*100)/100).toString().replace(".",",")+" "+S[i];
}
function earn(dt){for(const k in GAMES){const p=ps(k)*dt;st.g[k].m+=p;st.g[k].t+=p}}
const R=1.15;
function c0(k,i){return GAMES[k].gens[i][2]*Math.pow(R,st.g[k].o[i])}
function nFor(k,i){
  if(st.mode!=="max")return +st.mode;
  const n=Math.floor(Math.log(st.g[k].m*(R-1)/c0(k,i)+1)/Math.log(R));
  return Math.max(1,n);
}
function costOf(k,i,n){return c0(k,i)*(Math.pow(R,n)-1)/(R-1)}
function save(){st.last=Date.now();try{localStorage.setItem(K,JSON.stringify(st))}catch(e){}}
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("show");clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove("show"),3500)}

const cv=$("sc"),cx=cv.getContext("2d");let cw=0,ch=0;
function fit(){const sc=SCENES[st.cur];if(!sc)return;const d=window.devicePixelRatio||1;cw=cv.parentNode.clientWidth;ch=sc.h;cv.style.height=ch+"px";cv.width=Math.round(cw*d);cv.height=Math.round(ch*d);cx.setTransform(d,0,0,d,0,0)}
function frame(ts){const sc=SCENES[st.cur];if(sc&&cw){try{sc.draw(cx,cw,ch,st.g[st.cur].o,ts/1000)}catch(e){}}requestAnimationFrame(frame)}
window.addEventListener("resize",fit);
function build(){
  const k=st.cur,G=GAMES[k];
  document.documentElement.style.setProperty("--c",G.color);
  document.title=G.name+" | Mini Idle";
  $("tabs").innerHTML=Object.keys(GAMES).map(x=>`<button class="tab ${x===k?"on":""}" data-k="${x}">${GAMES[x].emoji} ${GAMES[x].name}</button>`).join("");
  $("big").textContent=G.emoji+" "+G.click;
  $("rows").innerHTML=G.gens.map((g,i)=>`<div class="row"><div><div class="nm">${g[0]}</div><div class="ds">${g[1]}</div><div class="own" id="o${i}"></div></div><button class="buy" data-i="${i}" id="b${i}"></button></div>`).join("");
  document.querySelectorAll(".mode").forEach(b=>b.classList.toggle("on",b.dataset.m===st.mode));
  fit();say();update();
}
function update(){
  const k=st.cur,G=GAMES[k],s=st.g[k];
  $("bal").textContent=G.cur+" "+fmt(s.m);
  $("ps").textContent=fmt(ps(k))+" por segundo";
  let sg=G.stages[0][1];for(const x of G.stages)if(s.t>=x[0])sg=x[1];
  $("stage").textContent=sg;
  G.gens.forEach((g,i)=>{
    const n=nFor(k,i),c=costOf(k,i,n),o=s.o[i],m=mult(o);
    $("o"+i).textContent="x"+o+(m>1?" · bônus x"+m:"")+" · "+fmt(g[3]*m)+"/s cada";
    const b=$("b"+i);b.disabled=s.m<c;b.innerHTML="Comprar "+n+"<br>"+G.cur+" "+fmt(c);
  });
}
function say(){const m=GAMES[st.cur].msgs;$("msg").textContent=m[Math.floor(Math.random()*m.length)]}

document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.classList.contains("tab")){st.cur=t.dataset.k;build();save();return}
  if(t.classList.contains("mode")){st.mode=t.dataset.m;document.querySelectorAll(".mode").forEach(b=>b.classList.toggle("on",b===t));update();return}
  if(t.id==="big"){
    const k=st.cur,v=clickVal(k);try{const sc=SCENES[k];sc.burst&&sc.burst(cx,cw,ch,performance.now()/1000)}catch(x){}st.g[k].m+=v;st.g[k].t+=v;
    const r=$("cb").getBoundingClientRect(),p=document.createElement("div");
    p.className="pop";p.textContent="+"+fmt(v);p.style.left=(e.clientX-r.left-10)+"px";p.style.top=(e.clientY-r.top-20)+"px";
    $("cb").appendChild(p);setTimeout(()=>p.remove(),800);update();return}
  if(t.classList.contains("buy")){
    const k=st.cur,i=+t.dataset.i,n=nFor(k,i),c=costOf(k,i,n);
    if(st.g[k].m>=c){st.g[k].m-=c;st.g[k].o[i]+=n;update();save()}return}
  if(t.id==="reset"){
    if(t.dataset.arm){const k=st.cur;st.g[k]={m:0,t:0,o:GAMES[k].gens.map(()=>0)};t.dataset.arm="";t.textContent="Zerar este jogo";build();save()}
    else{t.dataset.arm="1";t.textContent="Tem certeza? Toque de novo";setTimeout(()=>{t.dataset.arm="";t.textContent="Zerar este jogo"},3000)}
  }
});

const away=Math.min((Date.now()-st.last)/1000,MAXAWAY);
if(away>30){const before=st.g[st.cur].m;earn(away);build();toast("Enquanto você esteve fora: +"+GAMES[st.cur].cur+" "+fmt(st.g[st.cur].m-before))}
else build();
requestAnimationFrame(frame);
let prev=Date.now();
setInterval(()=>{const n=Date.now(),dt=Math.min((n-prev)/1000,5);prev=n;earn(dt);update()},250);
setInterval(save,5000);
setInterval(say,12000);
document.addEventListener("visibilitychange",()=>{if(document.hidden)save();else prev=Date.now()});
</script>
</body>
